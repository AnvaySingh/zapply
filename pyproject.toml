[project]
name = "zapply"
version = "0.1.0"
description = "A personal, local, single-user job-application copilot — Employable's brain without its hands."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "langfuse>=3.0,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "instructor>=1.5",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pypdf>=4.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
zapply = "zapply.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zapply"]

[tool.pytest.ini_options]
testpaths = ["evals"]
