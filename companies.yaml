# companies.yaml — the curated list of read-only sources apply-copilot polls.
# This is mine to control. Every entry is a public, consumption-friendly endpoint
# (public ATS JSON or an RSS feed). No portal scraping, no login — ever.
#
# Each source has a `type` and the fields that type needs:
#   greenhouse: company (display), board_token (URL slug; defaults to company)
#   lever:      company (the slug used in the Lever URL)
#   ashby:      company (display), board_name (URL slug; defaults to company)
#   rss:        company (label for the feed), url (the feed URL)
#
# The endpoints below were verified live when this file was seeded; boards change,
# so prune/replace freely — that's the point of curating your own list.

sources:
  # --- Greenhouse ---
  - { type: greenhouse, company: Stripe, board_token: stripe }
  - { type: greenhouse, company: GitLab, board_token: gitlab }
  - { type: greenhouse, company: Airbnb, board_token: airbnb }
  - { type: greenhouse, company: Coinbase, board_token: coinbase }
  - { type: greenhouse, company: Cloudflare, board_token: cloudflare }
  - { type: greenhouse, company: Reddit, board_token: reddit }
  - { type: greenhouse, company: Robinhood, board_token: robinhood }
  - { type: greenhouse, company: Samsara, board_token: samsara }
  - { type: greenhouse, company: Asana, board_token: asana }
  - { type: greenhouse, company: Twilio, board_token: twilio }
  - { type: greenhouse, company: Affirm, board_token: affirm }
  - { type: greenhouse, company: Pinterest, board_token: pinterest }
  - { type: greenhouse, company: Anthropic, board_token: anthropic }

  # --- Lever ---
  - { type: lever, company: spotify }
  - { type: lever, company: palantir }

  # --- Ashby (incl. AI labs) ---
  - { type: ashby, company: Ramp, board_name: ramp }
  - { type: ashby, company: Linear, board_name: linear }
  - { type: ashby, company: Replit, board_name: replit }
  - { type: ashby, company: Baseten, board_name: baseten }
  - { type: ashby, company: Modal, board_name: modal }
  - { type: ashby, company: Cohere, board_name: cohere }
  - { type: ashby, company: ElevenLabs, board_name: elevenlabs }
  - { type: ashby, company: Perplexity, board_name: perplexity }

  # --- RSS ---
  - { type: rss, company: We Work Remotely, url: https://weworkremotely.com/categories/remote-programming-jobs.rss }
