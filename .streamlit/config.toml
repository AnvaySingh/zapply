# Streamlit config for the apply-copilot demo app.
[server]
# The default watcher noisily probes transformers' vision modules (torchvision isn't installed).
# We don't need hot-reload for a demo — turning it off silences the noise and speeds startup.
fileWatcherType = "none"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0e8a6a"
backgroundColor = "#f6f8f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
